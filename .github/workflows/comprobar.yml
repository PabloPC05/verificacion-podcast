name: Comprobar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar los datos
        run: python3 herramientas/comprobar_datos.py
      - name: Generar la web
        run: python3 web-src/build.py
      - name: Avisar si la PR toca web/
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^web/'; then
            echo "::warning::La PR incluye cambios en web/. No hace falta: se regenera al aceptarla y puede dar conflictos."
          fi
