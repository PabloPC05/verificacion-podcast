<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificador en directo</title>
<style>
  :root {
    --fondo: #f5f4f0; --panel: #ffffff; --tinta: #1c1b19; --tenue: #6d6a63; --linea: #e2dfd7;
    --verde: #1f7a45; --verde-f: #e3f3e8; --lima: #5c7d14; --lima-f: #eef4d9;
    --ambar: #a55e00; --ambar-f: #fcefd6; --rojo: #b3261e; --rojo-f: #fbe4e1;
    --gris: #5f5c56; --gris-f: #ebe9e3; --acento: #2b4c9b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #131312; --panel: #1d1d1b; --tinta: #eceae4; --tenue: #9a968d; --linea: #32312e;
      --verde: #6fd398; --verde-f: #16301f; --lima: #b5d465; --lima-f: #283013;
      --ambar: #f0b45a; --ambar-f: #3a2a10; --rojo: #ff8f86; --rojo-f: #3d1a17;
      --gris: #b3afa6; --gris-f: #2a2927; --acento: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--tinta);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--linea); background: var(--panel);
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .micro { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tenue); }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--gris); }
  .punto.vivo { background: var(--rojo); animation: latido 1.4s infinite; }
  @keyframes latido { 50% { opacity: .35; } }
  .barra { width: 90px; height: 6px; background: var(--gris-f); border-radius: 3px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--verde); transition: width .15s; }
  .cuentas { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .ficha { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent; cursor: pointer; font-variant-numeric: tabular-nums; }
  .ficha.apagada { opacity: .35; }
  .v-verdadero { color: var(--verde); background: var(--verde-f); }
  .v-mayormente_verdadero { color: var(--lima); background: var(--lima-f); }
  .v-enganoso { color: var(--ambar); background: var(--ambar-f); }
  .v-falso { color: var(--rojo); background: var(--rojo-f); }
  .v-no_verificable, .v-otros { color: var(--gris); background: var(--gris-f); }
  button, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--tenue); }
  input[type=text] { background: var(--fondo); border: 1px solid var(--linea); border-radius: 8px; padding: 6px 10px; min-width: 0; }
  .ajustes { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
  .ajustes form { display: flex; gap: 6px; flex: 1 1 320px; }
  .ajustes input { flex: 1; }
  #aviso { display: none; padding: 8px 20px; background: var(--ambar-f); color: var(--ambar); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr); }
  section { min-height: 0; display: flex; flex-direction: column; }
  section + section { border-left: 1px solid var(--linea); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tenue);
    margin: 0; padding: 12px 20px 8px; font-weight: 600; }
  .rollo { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
  #texto p { margin: 0 0 10px; color: var(--tenue); }
  #texto p:last-child { color: var(--tinta); }
  #texto time, .meta { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
  #texto time { margin-right: 6px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--linea); border-left: 4px solid var(--gris);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .tarjeta.b-verdadero { border-left-color: var(--verde); }
  .tarjeta.b-mayormente_verdadero { border-left-color: var(--lima); }
  .tarjeta.b-enganoso { border-left-color: var(--ambar); }
  .tarjeta.b-falso { border-left-color: var(--rojo); }
  .cabecera { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .dicho { font-weight: 600; margin: 0 0 4px; }
  .cita { font-style: italic; color: var(--tenue); font-size: 13px; margin: 0 0 8px; }
  .resumen { margin: 0 0 4px; }
  .explicacion { margin: 0 0 8px; font-size: 14px; color: var(--tenue); }
  .fuentes { margin: 0; padding: 0; list-style: none; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .fuentes a { color: var(--acento); text-decoration: none; }
  .fuentes a:hover { text-decoration: underline; }
  .gira { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--gris); border-top-color: transparent;
    border-radius: 50%; animation: gira .8s linear infinite; vertical-align: -1px; margin-right: 5px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .vacio { color: var(--tenue); padding-top: 8px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 34vh 1fr; }
    section + section { border-left: 0; border-top: 1px solid var(--linea); }
    .cuentas { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Verificador en directo</h1>
  <div class="micro"><span class="punto" id="punto"></span><span id="estado">Conectando…</span>
    <span class="barra"><i id="nivel"></i></span></div>
  <button id="pausa">Pausar</button>
  <div class="cuentas" id="cuentas"></div>
</header>
<div class="ajustes">
  <form id="f-contexto"><input type="text" id="contexto" placeholder="Quién habla ahora: «Invitado: Fulano (partido), entrevista de noviembre de 2026»"><button>Guardar</button></form>
  <form id="f-manual"><input type="text" id="manual" placeholder="Comprobar una frase a mano…"><button>Verificar</button></form>
</div>
<div id="aviso"></div>
<main>
  <section><h2>Transcripción</h2><div class="rollo" id="texto"><p class="vacio">Esperando voz…</p></div></section>
  <section><h2>Afirmaciones</h2><div class="rollo" id="lista"><p class="vacio">Aún no se ha dicho nada comprobable.</p></div></section>
</main>
<script>
const NOMBRES = { verdadero: "Verdadero", mayormente_verdadero: "Casi cierto", enganoso: "Engañoso",
  falso: "Falso", no_verificable: "No verificable" };
const $ = id => document.getElementById(id);
const afirmaciones = new Map();
const ocultos = new Set();
let pausado = false, contextoTocado = false;

function nodo(etiqueta, clase, texto) {
  const n = document.createElement(etiqueta);
  if (clase) n.className = clase;
  if (texto != null) n.textContent = texto;
  return n;
}
function enviar(ruta, datos) {
  return fetch(ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
}
function claseDe(a) { return a.estado === "verificada" ? a.veredicto : "otros"; }

function pintarTarjeta(a) {
  let t = document.querySelector(`[data-id="${a.id}"]`);
  const lista = $("lista");
  if (!t) {
    lista.querySelector(".vacio")?.remove();
    t = nodo("article", "tarjeta");
    t.dataset.id = a.id;
    lista.prepend(t);
  }
  t.className = "tarjeta b-" + claseDe(a);
  t.style.display = ocultos.has(claseDe(a)) ? "none" : "";
  t.replaceChildren();
  const cab = nodo("div", "cabecera");
  if (a.estado === "verificada") {
    cab.append(nodo("span", "ficha v-" + a.veredicto, NOMBRES[a.veredicto]));
  } else if (a.estado === "verificando") {
    const f = nodo("span", "ficha v-otros"); f.append(nodo("span", "gira"), "Comprobando"); cab.append(f);
  } else if (a.estado === "error") {
    cab.append(nodo("span", "ficha v-otros", "Error"));
  } else {
    cab.append(nodo("span", "ficha v-otros", "Sin comprobar"));
  }
  let meta = a.hora + " · " + a.hablante;
  if (a.estado === "verificada") meta += " · confianza " + a.confianza;
  cab.append(nodo("span", "meta", meta));
  if (a.estado === "sin_verificar" || a.estado === "error") {
    const b = nodo("button", "", a.estado === "error" ? "Reintentar" : "Comprobar");
    b.onclick = () => enviar("/verificar", { id: a.id });
    cab.append(b);
  }
  t.append(cab, nodo("p", "dicho", a.afirmacion));
  if (a.cita) t.append(nodo("p", "cita", "«" + a.cita + "»"));
  if (a.estado === "error") t.append(nodo("p", "explicacion", a.error));
  if (a.estado === "verificada") {
    t.append(nodo("p", "resumen", a.resumen), nodo("p", "explicacion", a.explicacion));
    if (a.fuentes?.length) {
      const ul = nodo("ul", "fuentes");
      for (const f of a.fuentes) {
        if (!/^https?:\/\//.test(f.url)) continue;
        const enlace = nodo("a", "", f.titulo || f.url);
        enlace.href = f.url; enlace.target = "_blank"; enlace.rel = "noopener noreferrer";
        const li = nodo("li"); li.append(enlace); ul.append(li);
      }
      t.append(ul);
    }
  }
}

function pintarCuentas() {
  const n = { verdadero: 0, mayormente_verdadero: 0, enganoso: 0, falso: 0, no_verificable: 0, otros: 0 };
  for (const a of afirmaciones.values()) n[claseDe(a)]++;
  const caja = $("cuentas");
  caja.replaceChildren();
  for (const k of Object.keys(n)) {
    const f = nodo("span", `ficha v-${k}` + (ocultos.has(k) ? " apagada" : ""), `${NOMBRES[k] || "Pendientes"} ${n[k]}`);
    f.title = "Mostrar u ocultar";
    f.onclick = () => { ocultos.has(k) ? ocultos.delete(k) : ocultos.add(k); pintarCuentas(); afirmaciones.forEach(pintarTarjeta); };
    caja.append(f);
  }
}

function recibir(ev) {
  const d = ev.datos;
  if (ev.tipo === "transcripcion") {
    const caja = $("texto");
    const abajo = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 80;
    caja.querySelector(".vacio")?.remove();
    const p = nodo("p"); p.append(nodo("time", "", d.hora), d.texto); caja.append(p);
    if (abajo) caja.scrollTop = caja.scrollHeight;
  } else if (ev.tipo === "afirmacion") {
    afirmaciones.set(d.id, d); pintarTarjeta(d); pintarCuentas();
  } else if (ev.tipo === "pulso") {
    pausado = d.pausado;
    $("punto").className = "punto" + (d.micro && !d.pausado ? " vivo" : "");
    $("estado").textContent = !d.micro ? "Sin micrófono" : d.pausado ? "En pausa" :
      "Grabando" + (d.cola > 1 ? ` · ${d.cola} trozos en cola` : "");
    $("nivel").style.width = Math.max(0, Math.min(100, (d.nivel + 60) / 60 * 100)) + "%";
    $("pausa").textContent = d.pausado ? "Reanudar" : "Pausar";
    $("aviso").style.display = d.aviso ? "block" : "none";
    $("aviso").textContent = d.aviso;
    if (!contextoTocado && document.activeElement !== $("contexto")) $("contexto").value = d.contexto;
  }
}

function conectar() {
  $("texto").replaceChildren(nodo("p", "vacio", "Esperando voz…"));
  $("lista").replaceChildren(nodo("p", "vacio", "Aún no se ha dicho nada comprobable."));
  afirmaciones.clear();
  const es = new EventSource("/directo");
  es.onmessage = m => recibir(JSON.parse(m.data));
  es.onerror = () => { es.close(); $("estado").textContent = "Sin conexión, reintentando…"; $("punto").className = "punto"; setTimeout(conectar, 2000); };
}

$("pausa").onclick = () => enviar("/pausa", { pausado: !pausado });
$("contexto").oninput = () => { contextoTocado = true; };
$("f-contexto").onsubmit = e => { e.preventDefault(); enviar("/contexto", { texto: $("contexto").value }).then(() => { contextoTocado = false; }); };
$("f-manual").onsubmit = e => { e.preventDefault(); const v = $("manual").value.trim(); if (v) { enviar("/manual", { texto: v }); $("manual").value = ""; } };
pintarCuentas();
conectar();
</script>
</body>
</html>
